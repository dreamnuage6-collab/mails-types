<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mails types Méditerranées</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }

/* Layout: barre de commandes collante (langue, recherche, catégories) au-dessus d'une grille de fiches, une fiche par mail, bouton Copier en tête de chaque fiche. */
:root {
  --bg: #F2F6F7;
  --surface: #FFFFFF;
  --fg: #13262D;
  --muted: #566C74;
  --line: #D3DFE2;
  --accent: #0A6C82;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEF2;
  --ok: #17744A;
  --font-display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A1F;
    --surface: #15262D;
    --fg: #E6F0F2;
    --muted: #93A9B0;
    --line: #25393F;
    --accent: #4FB6CC;
    --accent-ink: #06222A;
    --accent-soft: #1A3A44;
    --ok: #5BCB92;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A1F;
  --surface: #15262D;
  --fg: #E6F0F2;
  --muted: #93A9B0;
  --line: #25393F;
  --accent: #4FB6CC;
  --accent-ink: #06222A;
  --accent-soft: #1A3A44;
  --ok: #5BCB92;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }

header.top { padding-block: 28px 18px; }
header.top h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(26px, 4vw, 36px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  text-wrap: balance;
}
header.top p { margin: 0; color: var(--muted); max-width: 62ch; }

.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 12px;
  display: grid;
  gap: 10px;
}
.bar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; gap: 3px; }
.seg button {
  font: inherit; font-weight: 600; font-size: 14px;
  border: 0; background: transparent; color: var(--muted);
  padding: 7px 18px; border-radius: 6px; cursor: pointer; min-width: 64px;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 40px 10px 12px;
}
.search input::placeholder { color: var(--muted); }
.search kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 6px;
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 13.5px; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 5px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
  gap: 16px;
  align-items: start;
  padding-top: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  min-width: 0;
  display: flex; flex-direction: column;
}
.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}
.num { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); font-weight: 500; flex: none; }
.titles { min-width: 0; flex: 1; }
.titles h2 {
  font-family: var(--font-display); font-weight: 600;
  font-size: 16.5px; line-height: 1.25; margin: 0;
  text-wrap: balance;
}
.tag { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.copy {
  flex: none; font: inherit; font-weight: 600; font-size: 13.5px;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; min-width: 84px;
}
.copy[data-state="done"] { background: var(--ok); color: #fff; }
:root[data-theme="dark"] .copy[data-state="done"] { color: #06190F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .copy[data-state="done"] { color: #06190F; } }

.mail {
  margin: 0; padding: 14px;
  white-space: pre-wrap; overflow-wrap: anywhere;
  font-family: var(--font-body); font-size: 14.5px; line-height: 1.6;
  max-width: 68ch;
}
.empty { grid-column: 1 / -1; color: var(--muted); padding: 40px 0; text-align: center; }

@media (max-width: 520px) {
  .count { margin-left: 0; width: 100%; }
  .copy { min-width: 72px; padding: 8px 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .copy, .chip, .seg button { transition: background-color .15s, color .15s, border-color .15s; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mails types</h1>
    <p>Camping Les Méditerranées, Marseillan. Choisissez la langue, trouvez le mail, cliquez sur Copier, puis collez-le dans votre réponse.</p>
  </header>

  <div class="bar" role="region" aria-label="Filtres">
    <div class="bar-row">
      <div class="seg" role="group" aria-label="Langue du mail">
        <button type="button" id="lang-fr" aria-pressed="true">FR</button>
        <button type="button" id="lang-en" aria-pressed="false">ENG</button>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="Rechercher un mail (chien, ACSI, piscine…)" autocomplete="off" aria-label="Rechercher un mail">
        <kbd aria-hidden="true">/</kbd>
      </div>
    </div>
    <div class="bar-row">
      <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>

  <main class="grid" id="grid"></main>
</div>

<script>
var CATS = [
  { id: 'all', label: 'Tous' },
  { id: 'resa', label: 'Réservation' },
  { id: 'empl', label: 'Emplacement' },
  { id: 'sejour', label: 'Séjour' }
];
var CAT_LABEL = { resa: 'Réservation', empl: 'Emplacement et nuisances', sejour: 'Séjour' };

var MAILS = [];

var state = { lang: 'fr', cat: 'all', q: '' };
try { var saved = localStorage.getItem('mt-lang'); if (saved === 'en' || saved === 'fr') state.lang = saved; } catch (e) {}

var grid = document.getElementById('grid');
var chipsEl = document.getElementById('chips');
var countEl = document.getElementById('count');
var qEl = document.getElementById('q');
var btnFr = document.getElementById('lang-fr');
var btnEn = document.getElementById('lang-en');

function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function buildChips() {
  chipsEl.textContent = '';
  CATS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = c.label;
    b.setAttribute('aria-pressed', String(state.cat === c.id));
    b.addEventListener('click', function () { state.cat = c.id; buildChips(); render(); });
    chipsEl.appendChild(b);
  });
}

function setLangButtons() {
  btnFr.setAttribute('aria-pressed', String(state.lang === 'fr'));
  btnEn.setAttribute('aria-pressed', String(state.lang === 'en'));
}

function selectNode(node) {
  var r = document.createRange();
  r.selectNodeContents(node);
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function flash(btn, label, done) {
  var old = btn.dataset.label;
  btn.textContent = label;
  if (done) btn.dataset.state = 'done';
  setTimeout(function () {
    btn.textContent = old;
    delete btn.dataset.state;
  }, 1800);
}

function copyMail(text, btn, node) {
  var fallback = function () {
    selectNode(node);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    flash(btn, ok ? 'Copié' : 'Ctrl+C', ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { flash(btn, 'Copié', true); }, fallback);
  } else {
    fallback();
  }
}

function render() {
  var q = norm(state.q.trim());
  var list = MAILS.filter(function (m) {
    if (state.cat !== 'all' && m.cat !== state.cat) return false;
    if (!q) return true;
    return norm(m.title + ' ' + m[state.lang]).indexOf(q) !== -1;
  });
  grid.textContent = '';
  list.forEach(function (m) {
    var card = document.createElement('article');
    card.className = 'card';

    var head = document.createElement('div');
    head.className = 'card-head';

    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = m.id;

    var titles = document.createElement('div');
    titles.className = 'titles';
    var h = document.createElement('h2');
    h.textContent = m.title;
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = CAT_LABEL[m.cat] + ' · ' + (state.lang === 'fr' ? 'Français' : 'English');
    titles.appendChild(h);
    titles.appendChild(tag);

    var body = document.createElement('div');
    body.className = 'mail';
    body.textContent = m[state.lang];

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'copy';
    copy.dataset.label = 'Copier';
    copy.textContent = 'Copier';
    copy.setAttribute('aria-label', 'Copier le mail ' + m.id + ' (' + (state.lang === 'fr' ? 'français' : 'anglais') + ')');
    copy.addEventListener('click', function () { copyMail(m[state.lang], copy, body); });

    head.appendChild(num);
    head.appendChild(titles);
    head.appendChild(copy);
    card.appendChild(head);
    card.appendChild(body);
    grid.appendChild(card);
  });
  if (!list.length) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = 'Aucun mail ne correspond à cette recherche.';
    grid.appendChild(e);
  }
  countEl.textContent = list.length + ' mail' + (list.length > 1 ? 's' : '') + ' affiché' + (list.length > 1 ? 's' : '');
}

function setLang(l) {
  state.lang = l;
  try { localStorage.setItem('mt-lang', l); } catch (e) {}
  setLangButtons();
  render();
}
btnFr.addEventListener('click', function () { setLang('fr'); });
btnEn.addEventListener('click', function () { setLang('en'); });
qEl.addEventListener('input', function () { state.q = qEl.value; render(); });
document.addEventListener('keydown', function (ev) {
  if (ev.key === '/' && document.activeElement !== qEl && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    ev.preventDefault();
    qEl.focus();
  }
});

setLangButtons();
buildChips();
countEl.textContent = 'Chargement…';
fetch('mails.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (data) { MAILS = data; render(); })
  .catch(function () {
    countEl.textContent = '';
    grid.textContent = '';
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = 'Impossible de charger les mails. Vérifiez la connexion internet puis rechargez la page.';
    grid.appendChild(e);
  });
</script>
</body>
</html>
